<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스네이크</title>
<style>
  :root{--bg:#0f1116;--grid:#171a21;--snake:#3ecf8e;--head:#7dffc0;--food:#ff6b5e;--text:#e8eaed;--muted:#9aa0aa}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
  h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
  .scores{display:flex;gap:28px;font-size:13px;color:var(--muted)}
  .scores b{color:var(--text);font-size:22px;font-weight:700}
  .stage{position:relative}
  canvas{background:var(--grid);border-radius:14px;border:1px solid #262a33;display:block}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    background:rgba(15,17,22,.82);border-radius:14px;backdrop-filter:blur(3px)}
  .overlay.hidden{display:none}
  .overlay h2{margin:0 0 6px;font-size:22px}
  .overlay p{margin:0 0 16px;color:var(--muted);font-size:13px}
  .overlay button{background:var(--text);color:#000;border:0;border-radius:10px;
    padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <h1>스네이크</h1>
  <div class="scores">
    <div>점수 <b id="score">0</b></div>
    <div>최고 <b id="best">0</b></div>
  </div>
  <div class="stage">
    <canvas id="c" width="420" height="420"></canvas>
    <div class="overlay" id="overlay">
      <div>
        <h2 id="ovTitle">준비됐나요?</h2>
        <p id="ovText">화살표 또는 WASD로 이동</p>
        <button id="playBtn">시작</button>
      </div>
    </div>
  </div>
  <div class="hint">스페이스: 일시정지 · 먹을수록 빨라집니다</div>

<script>
const c = document.getElementById("c"), x = c.getContext("2d");
const N = 21, CELL = c.width / N;
const $ = id => document.getElementById(id);

let snake, dir, nextDir, food, score, speed, loop, state; // state: idle|playing|paused|over
let best = +(localStorage.getItem("snake.best") || 0);
$("best").textContent = best;

function reset(){
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir;
  score = 0; speed = 140;
  placeFood();
  $("score").textContent = 0;
}
function placeFood(){
  do {
    food = {x: (Math.random()*N)|0, y: (Math.random()*N)|0};
  } while (snake.some(s => s.x===food.x && s.y===food.y));
}
function tick(){
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x<0||head.x>=N||head.y<0||head.y>=N || snake.some(s=>s.x===head.x&&s.y===head.y)){
    return gameOver();
  }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y){
    score++; $("score").textContent = score;
    if (speed > 60) speed -= 4;
    placeFood();
    restartLoop();
  } else {
    snake.pop();
  }
  draw();
}
function restartLoop(){ clearInterval(loop); loop = setInterval(tick, speed); }
function draw(){
  x.clearRect(0,0,c.width,c.height);
  // food
  x.fillStyle = getCol("--food");
  roundRect(food.x*CELL+3, food.y*CELL+3, CELL-6, CELL-6, 5); x.fill();
  // snake
  snake.forEach((s,i)=>{
    x.fillStyle = i===0 ? getCol("--head") : getCol("--snake");
    roundRect(s.x*CELL+1.5, s.y*CELL+1.5, CELL-3, CELL-3, 4); x.fill();
  });
}
function roundRect(px,py,w,h,r){
  x.beginPath();
  x.moveTo(px+r,py);
  x.arcTo(px+w,py,px+w,py+h,r);
  x.arcTo(px+w,py+h,px,py+h,r);
  x.arcTo(px,py+h,px,py,r);
  x.arcTo(px,py,px+w,py,r);
  x.closePath();
}
function getCol(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function play(){
  reset(); state = "playing";
  $("overlay").classList.add("hidden");
  draw(); restartLoop();
}
function gameOver(){
  clearInterval(loop); state = "over";
  if (score > best){ best = score; localStorage.setItem("snake.best", best); $("best").textContent = best; }
  $("ovTitle").textContent = "게임 오버";
  $("ovText").textContent = `점수 ${score}` + (score===best && score>0 ? " · 신기록!" : "");
  $("playBtn").textContent = "다시 하기";
  $("overlay").classList.remove("hidden");
}
function togglePause(){
  if (state === "playing"){ clearInterval(loop); state = "paused";
    $("ovTitle").textContent = "일시정지"; $("ovText").textContent = "스페이스로 계속";
    $("playBtn").textContent = "계속"; $("overlay").classList.remove("hidden"); }
  else if (state === "paused"){ state = "playing"; $("overlay").classList.add("hidden"); restartLoop(); }
}
$("playBtn").onclick = () => { (state==="paused") ? togglePause() : play(); };

const KEYS = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}
};
addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault();
    if (state==="playing"||state==="paused") togglePause();
    else play();
    return;
  }
  const k = KEYS[e.key];
  if (!k || state!=="playing") return;
  if (k.x === -dir.x && k.y === -dir.y) return; // no 180
  nextDir = k;
});
draw();
</script>
</body>
</html>
